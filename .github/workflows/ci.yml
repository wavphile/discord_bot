name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Format, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Prepare placeholder Compose environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build production container image
        run: docker compose build bot

      - name: Verify image contents and persistent volume permissions
        run: >-
          docker compose run --rm --entrypoint sh bot -c
          'test ! -e /app/.env && test ! -e /app/.env.example && test -w /app/data'

      - name: Remove placeholder Compose environment
        if: always()
        run: rm -f .env
